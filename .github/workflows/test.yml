name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only model dependency
        run: python -m pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m py_compile stratabyte_7m.py
      - run: python stratabyte_7m.py --self-test
